# Cloudflare Pages — configuration automatique
# Connecte ce dépôt sur dash.cloudflare.com > Pages > Create a project > Connect to Git
# Cloudflare lira ce fichier et lancera le build sans aucune configuration manuelle.

name = "mini-dreams"
pages_build_output_dir = "artifacts/mini-dreams/dist"
compatibility_date = "2024-01-01"

[build]
command = "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/mini-dreams run build"

[build.environment_variables]
NODE_VERSION = "20"
NODE_ENV = "production"
